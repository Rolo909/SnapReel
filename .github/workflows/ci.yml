name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Windows, CPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (CPU PyTorch, no GPU on CI runners)
        run: uv sync --frozen --extra cpu --extra online

      - name: Ruff
        run: uv run --frozen ruff check src tests scripts

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen pytest -q

  release:
    name: Release archive
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version=$(grep -oP '__version__ = "\K[^"]+' src/tvorka/__init__.py)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }

      - name: Build
        run: uv run --no-project python scripts/build_release.py --out dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tvorka-*-windows.zip
          generate_release_notes: true
